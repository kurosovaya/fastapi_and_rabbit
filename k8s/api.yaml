apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: api
  name: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  strategy: {}
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
      - image: fastapi_and_rabbit-api:latest
        imagePullPolicy: IfNotPresent
        name: fastapi-and-rabbit-api-qnp4h
        ports:
        - containerPort: 9000
        resources: {}
status: {}
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: api
  name: api
spec:
  ports:
  - name: http
    port: 9000
    nodePort: 30900
    protocol: TCP
    targetPort: 9000
  selector:
    app: api
  type: NodePort
status:
  loadBalancer: {}
