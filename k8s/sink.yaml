apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: sink
  name: sink
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sink
  strategy: {}
  template:
    metadata:
      labels:
        app: sink
    spec:
      containers:
      - image: fastapi_and_rabbit-sink:latest
        imagePullPolicy: IfNotPresent
        name: fastapi-and-rabbit-sink-d2tqw
        ports:
        - containerPort: 9001
        resources: {}
status: {}
---
