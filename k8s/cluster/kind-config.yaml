kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
- role: control-plane
  extraPortMappings:
  - containerPort: 30900 # api
    hostPort: 9000
    listenAddress: "127.0.0.1"
  - containerPort: 30901 # sink
    hostPort: 9001
    listenAddress: "127.0.0.1"
  - containerPort: 30902 # prometheus
    hostPort: 9002
    listenAddress: "127.0.0.1"
  - containerPort: 30903 # grafana
    hostPort: 9003
    listenAddress: "127.0.0.1"
  - containerPort: 31672 # rabbitmq management
    hostPort: 15672
    listenAddress: "127.0.0.1"
  - containerPort: 30432 # postgres
    hostPort: 5432
    listenAddress: "127.0.0.1"