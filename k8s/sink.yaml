kind: Service
metadata:
  labels:
    app: sink
  name: sink
spec:
  ports:
  - name: http
    port: 9001
    nodePort: 30901
    protocol: TCP
    targetPort: 9001
  selector:
    app: sink
  type: NodePort
status:
  loadBalancer: {}
