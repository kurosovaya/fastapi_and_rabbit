x-app-environment: &app-environment
  STORAGE_BACKEND: ${STORAGE_BACKEND:-mongo}

x-storage-depends-on: &storage-depends-on
  mongo-init:
    condition: service_completed_successfully
    required: false
  postgres:
    condition: service_healthy
    required: false

services:
  mongo:
    image: mongo:8
    profiles: ["mongo"]
    ports:
      - "${MONGO_HOST_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    command: mongod --replSet rs0
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 3s
      retries: 10
  mongo-init:
    image: mongo:8
    profiles: ["mongo"]
    depends_on:
      mongo:
        condition: service_healthy
    command: []
    entrypoint:
      - mongosh
      - --host
      - mongo
      - --eval
      - "try {
        rs.status()
        } catch (e) {
        rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongo:27017'}]})
        }"
    restart: "no"
  mongodb_exporter:
    image: percona/mongodb_exporter:0.52
    profiles: ["mongo"]
    depends_on:
      mongo:
        condition: service_healthy
    command:
      [
        "--compatible-mode",
        "--collect-all",
        "--mongodb.uri=mongodb://mongo:27017/?directConnection=true",
      ]
    ports:
      - "${MONGODB_EXPORTER_PORT:-9216}:9216"
  postgres:
    image: postgres:18.6
    profiles: ["postgres"]
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./services/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${POSTGRES_HOST_PORT:-27018}:5432"
    environment:
      POSTGRES_PASSWORD: password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      retries: 10
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    profiles: ["postgres"]
    environment:
      DATA_SOURCE_URI: postgres:5432/postgres?sslmode=disable
      DATA_SOURCE_USER: postgres
      DATA_SOURCE_PASS: password
  rabbitmq:
    image: rabbitmq:4.3.4-management-alpine
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./services/rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/20-prometheus.conf:ro
    healthcheck:
      test: rabbitmq-diagnostics -q check_port_connectivity
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 10s
  api:
    volumes:
      - ./services/api:/app
      - ./services/shared:/app/shared
    command: uvicorn main:app --host 0.0.0.0 --port 9000 --reload
    build:
      context: .
      dockerfile: services/api/Dockerfile
    ports:
      - "${API_PORT:-9000}:9000"
      - "${API_DEBUG_PORT:-5678}:5678"
    depends_on:
      <<: *storage-depends-on
      rabbitmq:
        condition: service_healthy
    environment:
      <<: *app-environment
  relayer:
    build:
      context: .
      dockerfile: services/relayer/Dockerfile
    depends_on:
      <<: *storage-depends-on
      rabbitmq:
        condition: service_healthy
    environment:
      <<: *app-environment
  worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    expose:
      - "9004"
    deploy:
      replicas: 1
    depends_on:
      <<: *storage-depends-on
      rabbitmq:
        condition: service_healthy
    environment:
      <<: *app-environment
  sink:
    build:
      context: .
      dockerfile: services/sink/Dockerfile
    volumes:
      - ./services/sink:/app
      - ./services/shared:/app/shared
    ports:
      - "${SINK_PORT:-9001}:9001"
    command: uvicorn main:app --host 0.0.0.0 --port 9001 --reload
    depends_on: *storage-depends-on
    environment:
      <<: *app-environment
  prometheus:
    image: prom/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9002}:9090"
    volumes:
      - ./services/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
  grafana:
    image: grafana/grafana
    ports:
      - "${GRAFANA_PORT:-9003}:3000"
    depends_on:
      - prometheus
    volumes:
      - ./services/grafana/provisioning:/etc/grafana/provisioning
      - ./services/grafana/dashboards:/etc/grafana/dashboards
      - grafana-data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
networks:
  default:

volumes:
  mongo-data:
  rabbitmq-data:
  prometheus-data:
  grafana-data:
  postgres-data:
