apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: postgres-exporter
  name: postgres-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-exporter
  strategy: {}
  template:
    metadata:
      labels:
        app: postgres-exporter
    spec:
      containers:
      - image: prometheuscommunity/postgres-exporter:v0.20.1
        name: postgres-exporter
        ports:
        - containerPort: 9187
        resources: {}
        env:
        - name: DATA_SOURCE_URI
          value: postgres:5432/postgres?sslmode=disable
        - name: DATA_SOURCE_USER 
          value: postgres
        - name: DATA_SOURCE_PASS
          value: password
status: {}
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: postgres-exporter
  name: postgres-exporter
spec:
  ports:
  - name: http
    port: 9187
    protocol: TCP
    targetPort: 9187
  selector:
    app: postgres-exporter
  type: ClusterIP
status:
  loadBalancer: {}
