global:
  scrape_interval: 5s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]
  - job_name: "api"
    static_configs:
      - targets: ["api:9000"]
  - job_name: "sink"
    static_configs:
      - targets: ["sink:9001"]
  - job_name: "mongodb"
    static_configs:
      - targets: ["mongodb_exporter:9216"]
  - job_name: "rabbitmq"
    static_configs:
      - targets: ["rabbitmq:15692"]
