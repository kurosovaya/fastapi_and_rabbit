apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels:
    app: rabbitmq
  name: rabbitmq-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 200Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: rabbitmq
  name: rabbitmq
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      hostname: rabbitmq
      containers:
      - image: rabbitmq:4.3.4-management-alpine
        name: rabbitmq
        volumeMounts:
          - name: data
            mountPath: /var/lib/rabbitmq
          - name: config
            mountPath: /etc/rabbitmq/conf.d/20-prometheus.conf
            subPath: 20-prometheus.conf
            readOnly: true
        resources: {}
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: rabbitmq-data
      - name: config
        configMap:
          name: rabbitmq-config
status: {}
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: rabbitmq
  name: rabbitmq
spec:
  ports:
  - name: management
    port: 15672
    targetPort: 15672
    nodePort: 31672
  - name: amqp
    port: 5672
    targetPort: 5672
  - name: prometheus
    port: 15692
    targetPort: 15692
  selector:
    app: rabbitmq
  type: NodePort
status:
  loadBalancer: {}
